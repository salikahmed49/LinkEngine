events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format including upstream response time and instance
    log_format upstream_logging '$remote_addr - $remote_user [$time_local] '
                                '"$request" $status $body_bytes_sent '
                                '"$http_referer" "$http_user_agent" '
                                'rt=$request_time uct="$upstream_connect_time" '
                                'uht="$upstream_header_time" urt="$upstream_response_time" '
                                'upstream="$upstream_addr"';

    access_log /var/log/nginx/access.log upstream_logging;
    error_log /var/log/nginx/error.log warn;

    # Rate limiting: 10 requests per second per IP (10MB zone tracks ~160k IPs)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream cluster with 3 FastAPI replicas & passive health checks
    upstream fastapi_cluster {
        # Round-robin load balancing (default)
        server api_1:8000 max_fails=3 fail_timeout=10s;
        server api_2:8000 max_fails=3 fail_timeout=10s;
        server api_3:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint for gateway & orchestration
        location /health {
            proxy_pass http://fastapi_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # Main API routing with per-IP rate limiting and failover
        location / {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://fastapi_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Automatic failover if a replica crashes mid-request
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_connect_timeout 2s;
            proxy_read_timeout 10s;
        }
    }
}
