services:
  # 1. FastAPI Web API Service
  - type: web
    name: link-analytics-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: link-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: link-analytics-redis
          property: connectionString
      - key: REDIS_CACHE_TTL
        value: "86400"
      - key: REDIS_STREAM_NAME
        value: "clicks:stream"

  # 2. Redis Streams Background Consumer Worker
  - type: worker
    name: link-analytics-worker
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m app.workers.click_consumer"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: link-analytics-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: link-analytics-redis
          property: connectionString
      - key: REDIS_STREAM_NAME
        value: "clicks:stream"
      - key: REDIS_CONSUMER_GROUP
        value: "analytics_group"

databases:
  # Managed PostgreSQL
  - name: link-analytics-db
    databaseName: linkanalytics
    user: linkuser
    plan: free

  # Managed Redis
  - name: link-analytics-redis
    plan: free
    ipAllowList: [] # internal access only
