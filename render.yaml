services:
  # 100% Free Tier FastAPI Web Service (Includes Embedded Redis Streams Consumer)
  - type: web
    name: link-analytics-api
    plan: free
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: EMBEDDED_WORKER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: link-analytics-db
          property: connectionString
      - key: REDIS_URL
        sync: false # Set to your free Upstash Redis URL (e.g. rediss://default:xxxx@xxxx.upstash.io:6379)
      - key: REDIS_CACHE_TTL
        value: "86400"
      - key: REDIS_STREAM_NAME
        value: "clicks:stream"

databases:
  # 100% Free Managed PostgreSQL
  - name: link-analytics-db
    databaseName: linkanalytics
    user: linkuser
    plan: free
